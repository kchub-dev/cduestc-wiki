packages: []

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# 传递依赖安全升级：把已知有漏洞的旧版本强制提升到已修复版本。
# 这些包本身不是直接依赖（由 vitepress / stylelint / eslint 等间接引入），
# 上游尚未升级时用 overrides 兜底。升级上游后应复核并移除对应条目。
# 复核方式：pnpm audit；对应 Dependabot 告警见仓库 Security 页。
overrides:
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  fast-uri@<3.1.8: 3.1.8
  js-yaml@<3.15.2: 3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  nanoid@<3.3.18: 3.3.18
  source-map-js@<1.2.2: 1.2.2
  '@xmldom/xmldom@<0.9.12': 0.9.12
  colord@<2.9.4: 2.9.4
  postcss-selector-parser@<7.1.6: 7.1.6
  sprintf-js@<1.1.3: 1.1.3
  esbuild@>=0.21.0 <0.25.0: 0.25.0
  vite@<6.4.3: 6.4.3
