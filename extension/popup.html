<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>科成星球 AI 直连助手</title>
    <style>
      :root {
        color-scheme: light dark;
        --brand: #2f6feb;
        --ok: #0b8a5f;
        --warn: #b45309;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 14px 16px 16px;
        font: 13px/1.55 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #1f2329;
      }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .sub { font-size: 11px; color: #8a919f; margin-bottom: 12px; }
      .card {
        border: 1px solid #e3e6ec;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .card h2 { font-size: 12px; margin: 0 0 8px; color: #4b5563; font-weight: 600; }
      label.radio {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 8px; border-radius: 8px; cursor: pointer;
      }
      label.radio:hover { background: rgba(47, 111, 235, 0.06); }
      .hint { font-size: 11px; color: #8a919f; margin-top: 4px; }
      .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
      .auth-name { font-weight: 600; }
      .auth-msg { font-size: 11px; color: #8a919f; }
      .ok { color: var(--ok); }
      .bad { color: var(--warn); }
      button {
        border: 1px solid #d0d7e2; background: #fff; color: #1f2329;
        border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px;
      }
      button:hover { border-color: var(--brand); color: var(--brand); }
      .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
      .foot a { font-size: 11px; color: var(--brand); text-decoration: none; }
      .ver { font-size: 11px; color: #8a919f; }
      @media (prefers-color-scheme: dark) {
        body { color: #e6e8ee; }
        .card { border-color: #3a3f4b; }
        .card h2 { color: #9aa3b2; }
        .auth-msg, .sub, .hint, .ver { color: #9aa3b2; }
        button { background: #23272f; border-color: #3a3f4b; color: #e6e8ee; }
      }
    </style>
  </head>
  <body>
    <h1>科成星球 AI 直连助手</h1>
    <div class="sub">在 Wiki 聊天框选择「本地直连」时，回答由你自己登录的 AI 网页账号生成。</div>

    <div class="card">
      <h2>默认上游</h2>
      <label class="radio">
        <input type="radio" name="provider" value="deepseek" />
        <span>DeepSeek（chat.deepseek.com）</span>
      </label>
      <label class="radio">
        <input type="radio" name="provider" value="doubao" />
        <span>豆包（www.doubao.com）</span>
      </label>
      <div class="row" id="thinking-row">
        <input type="checkbox" id="thinking" />
        <label for="thinking">DeepSeek 深度思考（R1，响应较慢）</label>
      </div>
    </div>

    <div class="card">
      <h2>登录状态</h2>
      <div class="row"><span class="auth-name">DeepSeek：</span><span class="auth-msg" id="auth-deepseek">检查中…</span></div>
      <div class="row"><span class="auth-name">豆包：</span><span class="auth-msg" id="auth-doubao">检查中…</span></div>
      <div class="hint">如果显示未登录：先在当前浏览器登录对应网站并打开一次它的页面，然后回到这里重新检查。</div>
      <div class="row"><button id="recheck" type="button">重新检查</button></div>
    </div>

    <div class="foot">
      <a href="https://wiki.kcos.club/ai-extension" target="_blank" rel="noopener noreferrer">使用说明 ↗</a>
      <span class="ver" id="version"></span>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
